<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>試合結果</title>
</head>
<body>
  <main>
    <h1>試合結果</h1>
    <p th:unless="${completed}">結果未確定です。全員の卒業後に結果を表示します。</p>
    <table th:if="${completed}">
      <caption>卒業順位と参加者の結果</caption>
      <thead>
        <tr><th scope="col">順位</th><th scope="col">名前</th><th scope="col">参加者種別</th><th scope="col">単位数</th><th scope="col">留年回数</th></tr>
      </thead>
      <tbody>
        <tr th:each="participant : ${results}">
          <td th:text="${participant.status.graduationRank}">1</td>
          <td th:text="${participant.name}">参加者</td>
          <td th:text="${participant.cpu} ? 'CPU' : '人間'">人間</td>
          <td th:text="${participant.status.credits}">124</td>
          <td th:text="${participant.status.repeatYears}">0</td>
        </tr>
      </tbody>
    </table>
  </main>
</body>
</html>
